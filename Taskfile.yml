version: '3'

tasks:
  # Database operations
  db:up:
    desc: Start PostgreSQL database with Docker Compose
    cmds:
      - docker compose up -d

  db:down:
    desc: Stop PostgreSQL database
    cmds:
      - docker compose down

  db:logs:
    desc: View database logs
    cmds:
      - docker compose logs -f postgres

  db:clean:
    desc: Remove database and volumes
    cmds:
      - docker compose down -v

  db:console:
    desc: Connect to database with psql
    cmds:
      - docker compose exec postgres psql -U portfolio_owner -d portfolio

  # Migration operations
  db:migrate:
    desc: Run Flyway migrations
    cmds:
      - docker compose up -d postgres
      - docker compose run --rm flyway migrate

  db:validate:
    desc: Validate Flyway migrations
    cmds:
      - docker compose run --rm flyway validate

  # CI/CD tasks
  ci:all:
    desc: Run all CI checks (validate, lint, check migrations)
    cmds:
      - task: ci:validate
      - task: ci:lint-yaml
      - task: ci:lint-sql
      - task: ci:check-migrations
      - echo "✓ All CI checks passed!"

  ci:validate:
    desc: Validate docker compose configuration syntax
    cmds:
      - docker compose config --quiet --no-interpolate

  ci:lint-yaml:
    desc: Lint YAML files
    cmds:
      - cmd: python -m yamllint .
        platforms: [windows]
      - cmd: yamllint .
        platforms: [linux, darwin]

  ci:lint-sql:
    desc: Lint SQL migration files
    cmds:
      - cmd: python -m sqlfluff lint migrations/ --dialect postgres
        platforms: [windows]
      - cmd: sqlfluff lint migrations/ --dialect postgres
        platforms: [linux, darwin]

  ci:lint-markdown:
    desc: Lint Markdown files
    cmds:
      - markdownlint-cli2 "**/*.md"

  ci:check-migrations:
    desc: Validate migration file naming convention
    cmds:
      - cmd: echo "Migration validation runs in CI pipeline"
        platforms: [windows]
      - cmd: |
          for file in migrations/*.sql; do
            if [[ ! $(basename "$file") =~ ^V[0-9]{14}__[a-z0-9_]+\.sql$ ]]; then
              echo "ERROR: Invalid migration file name: $(basename "$file")"
              exit 1
            fi
          done
          echo "All migration files follow correct naming convention"
        platforms: [linux, darwin]

  ci:install-tools:
    desc: Install CI/CD tools (requires pip and npm)
    cmds:
      - cmd: python -m pip install yamllint sqlfluff
        platforms: [windows]
      - cmd: pip install yamllint sqlfluff
        platforms: [linux, darwin]
      - npm install -g markdownlint-cli2
