# Database Migration Deployment
# Runs Flyway migrations against production Aurora database

name: Deploy Database Migrations

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-west-1
  FLYWAY_VERSION: "11"

jobs:
  deploy-migrations:
    name: Deploy Migrations to Production
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    concurrency:
      group: production-deployment
      cancel-in-progress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install Session Manager plugin
        run: |
          curl -sS \
            "https://s3.amazonaws.com/session-manager-downloads/plugin/latest/ubuntu_64bit/session-manager-plugin.deb" \
            -o "session-manager-plugin.deb"
          sudo dpkg -i session-manager-plugin.deb

      - name: Get bastion instance ID and state
        id: bastion
        run: |
          INSTANCE_INFO=$(aws ec2 describe-instances \
            --region ${{ env.AWS_REGION }} \
            --filters "Name=tag:Name,Values=portfolio-prod-bastion" \
            --query 'Reservations[0].Instances[0].[InstanceId,State.Name]' \
            --output text)

          INSTANCE_ID=$(echo "$INSTANCE_INFO" | awk '{print $1}')
          INSTANCE_STATE=$(echo "$INSTANCE_INFO" | awk '{print $2}')

          if [[ "$INSTANCE_ID" == "None" || -z "$INSTANCE_ID" ]]; then
            echo "::error::Bastion instance not found"
            exit 1
          fi

          echo "instance_id=$INSTANCE_ID" >> $GITHUB_OUTPUT
          echo "instance_state=$INSTANCE_STATE" >> $GITHUB_OUTPUT
          echo "Bastion instance: $INSTANCE_ID (state: $INSTANCE_STATE)"

      - name: Start bastion instance if stopped
        if: steps.bastion.outputs.instance_state != 'running'
        run: |
          echo "Starting bastion instance ${{ steps.bastion.outputs.instance_id }}..."
          aws ec2 start-instances --instance-ids ${{ steps.bastion.outputs.instance_id }} --region ${{ env.AWS_REGION }}

          echo "Waiting for bastion to reach running state..."
          aws ec2 wait instance-running \
            --instance-ids ${{ steps.bastion.outputs.instance_id }} \
            --region ${{ env.AWS_REGION }}

          echo "Waiting additional 30s for SSM agent to initialize..."
          sleep 30

          echo "Bastion instance is now running"

      - name: Get Aurora endpoint
        id: aurora
        run: |
          DB_HOST=$(aws rds describe-db-clusters \
            --region ${{ env.AWS_REGION }} \
            --query 'DBClusters[?contains(DBClusterIdentifier, `portfolio`)].Endpoint' \
            --output text)

          if [[ -z "$DB_HOST" ]]; then
            echo "::error::Aurora cluster not found"
            exit 1
          fi

          echo "db_host=$DB_HOST" >> $GITHUB_OUTPUT
          echo "Aurora endpoint: $DB_HOST"

      - name: Get database credentials from Secrets Manager
        id: db-secrets
        run: |
          # Get credentials from Terraform-managed secret
          SECRET=$(aws secretsmanager get-secret-value \
            --secret-id portfolio-prod-aurora-owner-2025111915155561680000000d \
            --region ${{ env.AWS_REGION }} \
            --query 'SecretString' \
            --output text)

          DB_USER=$(echo "$SECRET" | jq -r '.username')
          DB_PASSWORD=$(echo "$SECRET" | jq -r '.password')

          if [[ -z "$DB_USER" || -z "$DB_PASSWORD" ]]; then
            echo "::error::Failed to extract credentials from Secrets Manager"
            exit 1
          fi

          echo "::add-mask::$DB_PASSWORD"
          echo "db_user=$DB_USER" >> $GITHUB_OUTPUT
          echo "db_password=$DB_PASSWORD" >> $GITHUB_OUTPUT
          echo "db_name=portfolio" >> $GITHUB_OUTPUT
          echo "db_port=5432" >> $GITHUB_OUTPUT
          echo "db_host=${{ steps.aurora.outputs.db_host }}" >> $GITHUB_OUTPUT

      - name: Start SSM port forwarding to Aurora
        id: ssm-tunnel
        run: |
          DB_HOST="${{ steps.db-secrets.outputs.db_host }}"

          # Start port forwarding in background
          nohup aws ssm start-session \
            --target ${{ steps.bastion.outputs.instance_id }} \
            --document-name AWS-StartPortForwardingSessionToRemoteHost \
            --parameters "{\"host\":[\"$DB_HOST\"],\"portNumber\":[\"5432\"],\"localPortNumber\":[\"5432\"]}" \
            --region ${{ env.AWS_REGION }} > /tmp/ssm-session.log 2>&1 &

          SSM_PID=$!
          echo "ssm_pid=$SSM_PID" >> $GITHUB_OUTPUT
          echo "Started SSM session (PID: $SSM_PID)"

          # Wait for tunnel to establish
          echo "Waiting for SSM tunnel to establish..."
          sleep 20

          # Check if process is still running
          if ! kill -0 $SSM_PID 2>/dev/null; then
            echo "::error::SSM session failed to start"
            cat /tmp/ssm-session.log
            exit 1
          fi

          # Check if port is listening
          if ! timeout 10 bash -c "until nc -z localhost 5432; do sleep 1; done"; then
            echo "::error::Port 5432 not listening after 10 seconds"
            echo "SSM session log:"
            cat /tmp/ssm-session.log
            echo "Process status:"
            ps aux | grep -i ssm || true
            exit 1
          fi

          echo "SSM tunnel established successfully - port 5432 is listening"

      - name: Verify database connectivity and schema readiness
        run: |
          timeout 30 docker run --rm \
            --network host \
            -e "PGPASSWORD=${{ steps.db-secrets.outputs.db_password }}" \
            -e PGSSLMODE=require \
            postgres:17-alpine \
            psql \
            -h 127.0.0.1 \
            -p 5432 \
            -U ${{ steps.db-secrets.outputs.db_user }} \
            -d ${{ steps.db-secrets.outputs.db_name }} \
            -c "SELECT version();
                SELECT COUNT(*) as flyway_table_exists
                FROM information_schema.tables
                WHERE table_name='flyway_schema_history';"

      - name: Show pending migrations
        id: pending-migrations
        run: |
          DB_URL="jdbc:postgresql://localhost:5432/${{ steps.db-secrets.outputs.db_name }}?sslmode=require"

          PENDING_OUTPUT=$(docker run --rm \
            --network host \
            -v ${{ github.workspace }}/migrations:/flyway/sql \
            flyway/flyway:${{ env.FLYWAY_VERSION }} \
            -url="${DB_URL}" \
            -user=${{ steps.db-secrets.outputs.db_user }} \
            -password=${{ steps.db-secrets.outputs.db_password }} \
            -connectRetries=5 \
            -outputType=json \
            info)

          echo "$PENDING_OUTPUT"

          # Count pending migrations using JSON output
          PENDING_COUNT=$(echo "$PENDING_OUTPUT" | jq '[.migrations[] | select(.state=="Pending")] | length')
          echo "pending_count=$PENDING_COUNT" >> $GITHUB_OUTPUT

      - name: Run Flyway migrations
        id: run-migrations
        run: |
          DB_URL="jdbc:postgresql://localhost:5432/${{ steps.db-secrets.outputs.db_name }}?sslmode=require"

          docker run --rm \
            --network host \
            -v ${{ github.workspace }}/migrations:/flyway/sql \
            flyway/flyway:${{ env.FLYWAY_VERSION }} \
            -url="${DB_URL}" \
            -user=${{ steps.db-secrets.outputs.db_user }} \
            -password=${{ steps.db-secrets.outputs.db_password }} \
            -connectRetries=5 \
            -validateMigrationNaming=true \
            -outputType=json \
            migrate

      - name: Verify migrations applied
        id: applied-migrations
        run: |
          DB_URL="jdbc:postgresql://localhost:5432/${{ steps.db-secrets.outputs.db_name }}?sslmode=require"

          APPLIED_OUTPUT=$(docker run --rm \
            --network host \
            -v ${{ github.workspace }}/migrations:/flyway/sql \
            flyway/flyway:${{ env.FLYWAY_VERSION }} \
            -url="${DB_URL}" \
            -user=${{ steps.db-secrets.outputs.db_user }} \
            -password=${{ steps.db-secrets.outputs.db_password }} \
            -outputType=json \
            info)

          echo "$APPLIED_OUTPUT"

          # Count applied migrations using JSON output
          APPLIED_COUNT=$(echo "$APPLIED_OUTPUT" | jq '[.migrations[] | select(.state=="Success")] | length')
          echo "applied_count=$APPLIED_COUNT" >> $GITHUB_OUTPUT

      - name: Create migration summary
        if: always()
        run: |
          PENDING="${{ steps.pending-migrations.outputs.pending_count }}"
          APPLIED="${{ steps.applied-migrations.outputs.applied_count }}"
          DB_HOST="${{ steps.db-secrets.outputs.db_host }}"

          echo "## Database Migration Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Tag**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Database**: ${DB_HOST:-N/A}" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Pending Migrations**: ${PENDING:-N/A}" >> $GITHUB_STEP_SUMMARY
          echo "- **Applied Migrations**: ${APPLIED:-N/A}" >> $GITHUB_STEP_SUMMARY

      - name: Terminate SSM session
        if: always()
        run: |
          if [[ -n "${{ steps.ssm-tunnel.outputs.ssm_pid }}" ]]; then
            echo "Terminating SSM session (PID: ${{ steps.ssm-tunnel.outputs.ssm_pid }})"
            kill ${{ steps.ssm-tunnel.outputs.ssm_pid }} 2>/dev/null || true
            sleep 2
          fi

      - name: Stop bastion instance
        if: always() && steps.bastion.outputs.instance_state != 'running'
        run: |
          echo "Stopping bastion instance ${{ steps.bastion.outputs.instance_id }}..."
          aws ec2 stop-instances --instance-ids ${{ steps.bastion.outputs.instance_id }} --region ${{ env.AWS_REGION }}
          echo "Bastion instance stop initiated"
