services:
  postgres:
    image: postgres:18-alpine
    container_name: postgres
    command:
      - "postgres"
      - "-c"
      - "shared_preload_libraries=pg_stat_statements"
    environment:
      POSTGRES_DB: portfolio
      # Default superuser (creates database and initial users)
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Bootstrap users before Flyway runs
      - ./docker/postgres/init-users.sql:/docker-entrypoint-initdb.d/01-init-users.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d portfolio"]
      interval: 10s
      timeout: 5s
      retries: 5

  flyway:
    image: flyway/flyway:11
    container_name: flyway
    command: migrate
    volumes:
      - ./migrations:/flyway/sql
      - ./seeds:/flyway/seeds
    environment:
      - FLYWAY_URL=jdbc:postgresql://postgres:5432/portfolio
      # Use portfolio_owner for migrations (has DDL rights)
      - FLYWAY_USER=portfolio_owner
      - FLYWAY_PASSWORD=portfolio_owner_dev_pass
      - FLYWAY_BASELINE_ON_MIGRATE=true
      - FLYWAY_LOCATIONS=filesystem:/flyway/sql,filesystem:/flyway/seeds
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
